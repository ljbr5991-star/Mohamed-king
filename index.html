<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آخر العنقود | إكسسوارات، مكياج وعطور - منوف</title>
<meta name="description" content="محل آخر العنقود في منوف - إكسسوارات، مكياج، عطور، شرابات، نظارات ومنتجات العناية بالبشرة بأسعار مناسبة للكل من عمر ٥ لـ ٥٠.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #EC1E82;
    --pink-soft: #FF6FB0;
    --magenta-deep: #7A0F5E;
    --plum: #33093A;
    --plum-dark: #220526;
    --gold: #F2B33D;
    --gold-light: #FFD873;
    --cream: #FFF3F8;
    --white: #FFFFFF;
    --ink: #3A0E33;
    --wa: #25D366;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--plum-dark);
    color: var(--ink);
    font-family: 'Cairo', sans-serif;
    overflow-x: hidden;
  }

  img{ max-width:100%; display:block; }
  a{ color: inherit; text-decoration:none; }
  section{ scroll-margin-top: 76px; }

  /* ---------- background texture ---------- */
  .stars-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(2px 2px at 80% 15%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 60%, rgba(255,255,255,.35), transparent),
      radial-gradient(2px 2px at 30% 80%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 45% 40%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 15% 55%, rgba(255,255,255,.25), transparent),
      radial-gradient(1.5px 1.5px at 70% 90%, rgba(255,255,255,.25), transparent);
    pointer-events:none;
    opacity:.7;
  }

  .float-deco{
    position:absolute;
    pointer-events:none;
    opacity:.55;
    animation: bob 6s ease-in-out infinite;
    z-index:0;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(var(--r,0deg)); }
    50%{ transform: translateY(-14px) rotate(var(--r,0deg)); }
  }

  /* ---------- NAV ---------- */
  .nav{
    position: sticky;
    top:0;
    z-index: 50;
    background: rgba(34,5,38,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(242,179,61,.25);
  }
  .nav-inner{
    max-width: 720px;
    margin:0 auto;
    padding: 10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  .nav-brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Lalezar', sans-serif;
    color: var(--gold-light);
    font-size: 1.15rem;
  }
  .nav-brand img{
    width:34px; height:34px; border-radius:50%;
    border: 1.5px solid var(--gold);
  }
  .nav-links{
    display:flex;
    gap: 4px;
    font-size:.82rem;
    font-weight:700;
  }
  .nav-links a{
    color: var(--cream);
    opacity:.8;
    padding: 8px 10px;
    border-radius: 20px;
    transition: opacity .2s, background .2s;
  }
  .nav-links a:hover{ opacity:1; background: rgba(255,255,255,.08); }
  .nav-call{
    background: var(--pink);
    color:var(--white) !important;
    padding: 8px 14px !important;
    border-radius: 20px;
    opacity:1 !important;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ---------- HERO ---------- */
  .hero{
    text-align:center;
    padding: 46px 0 20px;
    position:relative;
  }

  .hero-frame{
    position:relative;
    width: 220px;
    height:220px;
    margin: 0 auto 18px;
    animation: pop-in .8s cubic-bezier(.2,1.4,.4,1) both;
  }

  .hero-frame img{
    width:100%; height:100%; border-radius:50%;
    box-shadow: 0 0 0 6px var(--plum-dark), 0 0 0 8px var(--gold), 0 18px 40px rgba(0,0,0,.45);
    position:relative; z-index:2;
  }

  .hero-ring{
    position:absolute;
    inset:-16px;
    border-radius:50%;
    border: 2px dashed rgba(242,179,61,.5);
    animation: spin 30s linear infinite;
    z-index:1;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @keyframes pop-in{
    0%{ transform: scale(.4) rotate(-15deg); opacity:0; }
    100%{ transform: scale(1) rotate(0); opacity:1; }
  }

  .hero .glow{
    position:absolute;
    inset:-30px;
    background: radial-gradient(circle, rgba(236,30,130,.45) 0%, transparent 70%);
    z-index:0;
    filter: blur(6px);
  }

  .brand-name{
    font-family:'Lalezar', sans-serif;
    font-size: clamp(2.6rem, 11vw, 3.6rem);
    line-height:1;
    margin: 6px 0 4px;
    background: linear-gradient(90deg, var(--gold-light), var(--pink-soft), var(--pink), var(--gold-light));
    background-size: 250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 6s linear infinite;
    letter-spacing: 1px;
  }
  @keyframes shine{
    0%{ background-position: 0% center; }
    100%{ background-position: 250% center; }
  }

  .tagline-ribbon{
    display:inline-block;
    background: var(--pink);
    color: var(--white);
    font-family:'Lalezar', sans-serif;
    font-size: 1.15rem;
    padding: 6px 26px;
    border-radius: 40px;
    margin: 10px 0 18px;
    box-shadow: 0 6px 18px rgba(236,30,130,.4);
    transform: rotate(-2deg);
  }

  .hero p.sub{
    color: var(--cream);
    font-size: 1rem;
    line-height:1.9;
    max-width: 480px;
    margin: 0 auto 26px;
    opacity:.92;
  }

  .cta-row{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size: .95rem;
    padding: 13px 26px;
    border-radius: 30px;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn:active{ transform: scale(.96); }

  .btn-primary{
    background: linear-gradient(135deg, var(--pink), var(--magenta-deep));
    color: var(--white);
    box-shadow: 0 10px 24px rgba(236,30,130,.4);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px rgba(236,30,130,.5); }

  .btn-ghost{
    background: rgba(255,255,255,.08);
    color: var(--cream);
    border: 1.5px solid rgba(255,255,255,.35);
  }
  .btn-ghost:hover{ background: rgba(255,255,255,.15); }

  /* ---------- scroll reveal ---------- */
  .reveal{
    opacity:0;
    transform: translateY(22px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .reveal.in{ opacity:1; transform: translateY(0); }

  /* ---------- divider ---------- */
  .divider{
    width:100%; height: 26px;
    margin: 50px 0 -24px;
    opacity:.5;
  }

  /* ---------- SECTION HEADERS ---------- */
  .section{ margin-top: 58px; position:relative; }

  .section-head{
    text-align:center;
    margin-bottom: 26px;
  }
  .section-head h2{
    font-family:'Lalezar', sans-serif;
    font-size: 1.9rem;
    color: var(--white);
    margin: 0 0 6px;
  }
  .section-head p{
    color: var(--pink-soft);
    margin:0;
    font-size:.92rem;
  }

  /* ---------- CATEGORY STICKERS ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 14px;
  }

  .cat-card{
    background: radial-gradient(circle at 30% 20%, #ffffff 0%, var(--cream) 55%, #ffe3f1 100%);
    border-radius: 26px;
    padding: 22px 14px 18px;
    text-align:center;
    position:relative;
    box-shadow: 0 12px 24px rgba(0,0,0,.28);
    border: 2.5px dashed var(--pink);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .cat-card:nth-child(odd){ transform: rotate(-2deg); }
  .cat-card:nth-child(even){ transform: rotate(2deg); }
  .cat-card:active{ transform: scale(.97) rotate(0deg); }

  .cat-icon{
    width: 46px; height:46px;
    margin: 0 auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cat-icon svg{ width:100%; height:100%; }

  .cat-card h3{
    font-family:'Lalezar', sans-serif;
    font-size: 1.2rem;
    color: var(--magenta-deep);
    margin: 0 0 6px;
  }
  .cat-card p{
    font-size: .82rem;
    color: #6b4060;
    margin:0;
    line-height:1.6;
  }

  .cat-pin{
    position:absolute;
    top:-10px;
    right:50%;
    transform: translateX(50%);
    width: 22px; height:22px;
    background: var(--gold);
    border-radius:50%;
    box-shadow: 0 3px 6px rgba(0,0,0,.3), inset 0 -2px 3px rgba(0,0,0,.2);
  }

  /* ---------- WHY US ---------- */
  .perks{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .perk{
    display:flex;
    align-items:center;
    gap:14px;
    background: rgba(255,255,255,.06);
    border-radius: 18px;
    padding: 16px 18px;
    border-inline-start: 5px solid var(--gold);
  }
  .perk .num{
    font-family:'Lalezar', sans-serif;
    font-size:1.6rem;
    color: var(--gold-light);
    min-width: 36px;
  }
  .perk h4{
    margin:0 0 2px;
    color: var(--white);
    font-size:1.05rem;
    font-family:'Cairo',sans-serif;
    font-weight:700;
  }
  .perk p{
    margin:0;
    color: var(--cream);
    font-size:.85rem;
    opacity:.85;
  }

  /* ---------- TESTIMONIALS ---------- */
  .testi-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding: 6px 2px 18px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .testi-scroll::-webkit-scrollbar{ height:6px; }
  .testi-scroll::-webkit-scrollbar-thumb{ background: var(--pink); border-radius:6px; }

  .testi-card{
    scroll-snap-align: start;
    min-width: 76%;
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(242,179,61,.3);
    border-radius: 18px;
    padding: 18px;
    flex-shrink:0;
  }
  .testi-stars{ color: var(--gold-light); font-size:.9rem; margin-bottom:8px; letter-spacing:2px; }
  .testi-card p.quote{
    color: var(--cream);
    font-size:.88rem;
    line-height:1.8;
    margin:0 0 10px;
  }
  .testi-name{
    color: var(--pink-soft);
    font-weight:700;
    font-size:.82rem;
  }

  /* ---------- INFO CARD ---------- */
  .info-card{
    background: linear-gradient(135deg, var(--magenta-deep), var(--plum) 60%, var(--plum-dark));
    border-radius: 24px;
    padding: 28px 24px;
    position:relative;
    overflow:hidden;
    border: 2px solid rgba(242,179,61,.5);
  }
  .info-card::before{
    content:"";
    position:absolute;
    width:180px; height:180px;
    background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
    top:-60px; left:-60px;
    border-radius:50%;
  }
  .info-row{
    display:flex;
    gap:14px;
    align-items:flex-start;
    margin-bottom: 20px;
    position:relative;
  }
  .info-row:last-child{ margin-bottom:0; }
  .info-icon{
    font-size:1.5rem;
    background: rgba(242,179,61,.18);
    border: 1.5px solid var(--gold);
    width:42px; height:42px;
    min-width:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .info-row h4{
    margin:0 0 4px;
    color: var(--gold-light);
    font-size:.85rem;
    font-family:'Cairo',sans-serif;
    font-weight:700;
  }
  .info-row p, .info-row a{
    margin:0;
    color: var(--white);
    font-size: .98rem;
    line-height:1.7;
  }
  .info-row a.phone-link{
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:.5px;
  }

  .map-frame{
    margin-top: 22px;
    border-radius: 16px;
    overflow:hidden;
    border: 1.5px solid rgba(242,179,61,.4);
    position:relative;
  }
  .map-frame iframe{
    width:100%;
    height: 220px;
    border:0;
    display:block;
    filter: saturate(.9) contrast(1.05);
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    margin-top: 54px;
    padding-top: 24px;
    border-top: 1.5px dashed rgba(255,255,255,.2);
  }
  footer .fb-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color: var(--pink-soft);
    font-weight:700;
    font-size:.92rem;
    margin-bottom: 10px;
  }
  footer .fine{
    color: rgba(255,255,255,.45);
    font-size:.78rem;
  }

  /* ---------- FLOATING WHATSAPP ---------- */
  .wa-float{
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 60;
    width: 56px; height:56px;
    border-radius:50%;
    background: var(--wa);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 22px rgba(0,0,0,.4);
    animation: pulse-wa 2.6s ease-in-out infinite;
  }
  .wa-float svg{ width:28px; height:28px; }
  @keyframes pulse-wa{
    0%,100%{ box-shadow: 0 8px 22px rgba(0,0,0,.4), 0 0 0 0 rgba(37,211,102,.5); }
    50%{ box-shadow: 0 8px 22px rgba(0,0,0,.4), 0 0 0 10px rgba(37,211,102,0); }
  }

  @media (max-width:380px){
    .cat-grid{ gap:16px 10px; }
    .cat-card{ padding:18px 10px 14px; }
    .nav-links{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
